# ---- Quem somos ----
sobre_selo: "Quem somos"
sobre_titulo: "Uma associação nascida da vontade de ver a juventude ocupar espaços"
sobre_paragrafo1: >-
  A Associação de Vestibulandos da Bahia — Anésia Cauaçu nasceu em 2021, fundada
  pela pedagoga Thaíla Bastos, pelo professor Matheus Moraes e amigos em comum.
  A ideia era simples e teimosa: nenhum jovem deveria ficar fora da universidade
  porque não pode pagar um cursinho.
sobre_paragrafo2: >-
  No primeiro ano, mais de 300 estudantes do ensino público foram contemplados.
  A proposta cresceu, virou associação sem fins lucrativos e hoje mantém o
  Cursinho Pré-Vestibular Comunitário Anésia Cauaçu, com turmas presenciais em
  Jequié e turmas online que alcançam mais de 56 cidades baianas.
sobre_paragrafo3: >-
  Em 2025, o projeto foi selecionado pelo Ministério da Educação para integrar a
  Rede Nacional de Cursinhos Populares (CPOP), um reconhecimento do trabalho
  coletivo de professores voluntários, alunos e comunidade.

nome_titulo: "Por que “Anésia Cauaçu”?"
nome_paragrafo1: >-
  O nome é uma homenagem a Anésia Cauaçu, mulher baiana que lutou ao lado da
  família no cangaço do início do século XX, em Jequié. Antes de Maria Bonita e
  Dadá, ela já comandava homens e enfrentava o sertão.
nome_paragrafo2: >-
  Escolher esse nome é dizer que coragem, resistência e protagonismo feminino
  fazem parte da nossa história — e que a juventude do sertão também escreve a sua.

