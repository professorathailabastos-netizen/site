# ------------------------------------------------------------
# Configuração do painel de edição (Decap CMS)
# Site: anesiacauacu.com.br
# ------------------------------------------------------------

backend:
  name: git-gateway
  branch: main

# Onde as imagens enviadas pelo painel são salvas
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Idioma do painel
locale: "pt"

# Nome exibido no topo do painel
site_url: https://anesiacauacu.com.br
display_url: https://anesiacauacu.com.br
logo_url: https://anesiacauacu.com.br/assets/uploads/perfil-instagram.jpg

# Publicação imediata: o botão "Publish" salva direto no site.
# (Não usar publish_mode aqui — "simple" não é um valor aceito pelo Decap CMS.)

collections:
  # ============================================================
  # TEXTOS DA PÁGINA INICIAL
  # ============================================================
  - name: "home"
    label: "Página inicial"
    label_singular: "Texto da página inicial"
    description: "Textos que aparecem na página de abertura do site"
    files:
      - name: "home"
        label: "Todos os textos da home"
        file: "conteudo/home.yml"
        fields:
          - label: "=== TOPO DO SITE ==="
            name: "divisor1"
            widget: "hidden"
            default: ""

          - { label: "Pequeno texto acima do título", name: "hero_selo", widget: "string" }
          - { label: "Título principal", name: "hero_titulo", widget: "string" }
          - { label: "Trecho destacado do título (em amarelo)", name: "hero_titulo_destaque", widget: "string" }
          - { label: "Texto de apresentação", name: "hero_texto", widget: "text" }
          - { label: "Texto do botão principal", name: "hero_botao_principal", widget: "string" }
          - { label: "Texto do botão secundário", name: "hero_botao_secundario", widget: "string" }
          - { label: "Foto principal", name: "hero_foto", widget: "image", required: false }
          - { label: "Descrição da foto (acessibilidade)", name: "hero_foto_alt", widget: "string", required: false }

          - label: "Selos de destaque (3 no máximo)"
            name: "hero_selos"
            widget: "list"
            field: { label: "Selo", name: "item", widget: "string" }

          - label: "Número 1"
            name: "grupo_num1"
            widget: "object"
            fields:
              - { label: "Valor (só números)", name: "valor", widget: "number" }
              - { label: "Sufixo (ex.: +)", name: "sufixo", widget: "string", required: false }
              - { label: "Legenda", name: "rotulo", widget: "string" }

          - label: "Número 2"
            name: "grupo_num2"
            widget: "object"
            fields:
              - { label: "Valor (só números)", name: "valor", widget: "number" }
              - { label: "Sufixo (ex.: +)", name: "sufixo", widget: "string", required: false }
              - { label: "Legenda", name: "rotulo", widget: "string" }

          - label: "Número 3"
            name: "grupo_num3"
            widget: "object"
            fields:
              - { label: "Valor (só números)", name: "valor", widget: "number" }
              - { label: "Legenda", name: "rotulo", widget: "string" }

          - { label: "Título do cartão flutuante", name: "hero_cartao_titulo", widget: "string" }
          - { label: "Texto do cartão flutuante", name: "hero_cartao_texto", widget: "text" }

          - label: "=== FAIXA ROLANTE ==="
            name: "divisor2"
            widget: "hidden"
            default: ""
          - label: "Frases da faixa amarela"
            name: "faixa_itens"
            widget: "list"
            field: { label: "Frase", name: "item", widget: "string" }

          - label: "=== QUEM SOMOS ==="
            name: "divisor3"
            widget: "hidden"
            default: ""
          - { label: "Selo da seção", name: "sobre_selo", widget: "string" }
          - { label: "Título da seção", name: "sobre_titulo", widget: "string" }
          - { label: "Parágrafo 1", name: "sobre_paragrafo1", widget: "text" }
          - { label: "Parágrafo 2", name: "sobre_paragrafo2", widget: "text" }
          - { label: "Parágrafo 3", name: "sobre_paragrafo3", widget: "text" }
          - { label: "Título do cartão 'Por que Anésia Cauaçu'", name: "nome_titulo", widget: "string" }
          - { label: "Texto do cartão — parte 1", name: "nome_paragrafo1", widget: "text" }
          - { label: "Texto do cartão — parte 2", name: "nome_paragrafo2", widget: "text" }

          - label: "=== IMPACTO ==="
            name: "divisor4"
            widget: "hidden"
            default: ""
          - { label: "Selo da seção", name: "impacto_selo", widget: "string" }
          - { label: "Título da seção", name: "impacto_titulo", widget: "string" }
          - { label: "Texto de apoio", name: "impacto_texto", widget: "text" }
          - label: "Números do impacto"
            name: "grupo_impacto"
            widget: "object"
            fields:
              - { label: "Número 1 — valor", name: "numero1_valor", widget: "number" }
              - { label: "Número 1 — sufixo", name: "numero1_sufixo", widget: "string", required: false }
              - { label: "Número 1 — legenda", name: "numero1_rotulo", widget: "string" }
              - { label: "Número 2 — valor", name: "numero2_valor", widget: "number" }
              - { label: "Número 2 — sufixo", name: "numero2_sufixo", widget: "string", required: false }
              - { label: "Número 2 — legenda", name: "numero2_rotulo", widget: "string" }
              - { label: "Número 3 — valor", name: "numero3_valor", widget: "number" }
              - { label: "Número 3 — legenda", name: "numero3_rotulo", widget: "string" }
          - { label: "Título 'Onde nossos alunos chegam'", name: "impacto_onde_titulo", widget: "string" }
          - { label: "Texto 'Onde nossos alunos chegam'", name: "impacto_onde_texto", widget: "text" }
          - label: "Lista de conquistas"
            name: "impacto_lista"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }

          - label: "=== CURSOS ==="
            name: "divisor5"
            widget: "hidden"
            default: ""
          - { label: "Selo da seção", name: "cursos_selo", widget: "string" }
          - { label: "Título da seção", name: "cursos_titulo", widget: "string" }
          - { label: "Texto de apoio", name: "cursos_texto", widget: "text" }
          - label: "Cartões de cursos"
            name: "cursos"
            widget: "list"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Ícone (emoji)", name: "icone", widget: "string", required: false }
              - { label: "Texto", name: "texto", widget: "text" }
              - label: "Lista de itens"
                name: "itens"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - { label: "Destacar este cartão?", name: "destaque", widget: "boolean", default: false }

          - label: "=== DEPOIMENTOS ==="
            name: "divisor6"
            widget: "hidden"
            default: ""
          - { label: "Selo da seção", name: "depoimentos_selo", widget: "string" }
          - { label: "Título da seção", name: "depoimentos_titulo", widget: "string" }
          - label: "Depoimentos"
            name: "depoimentos"
            widget: "list"
            fields:
              - { label: "Frase", name: "frase", widget: "text" }
              - { label: "Nome", name: "nome", widget: "string" }
              - { label: "Descrição", name: "descricao", widget: "string" }

          - label: "=== INSCRIÇÕES ==="
            name: "divisor7"
            widget: "hidden"
            default: ""
          - { label: "Selo da seção", name: "inscricao_selo", widget: "string" }
          - { label: "Título da seção", name: "inscricao_titulo", widget: "string" }
          - { label: "Texto de apoio", name: "inscricao_texto", widget: "text" }
          - label: "Quem pode se inscrever"
            name: "inscricao_quem_pode"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - { label: "Documentos para matrícula", name: "inscricao_documentos", widget: "text" }

          - label: "=== CONTATO ==="
            name: "divisor8"
            widget: "hidden"
            default: ""
          - { label: "Título do contato", name: "contato_titulo", widget: "string" }
          - { label: "Texto do contato", name: "contato_texto", widget: "string" }
          - { label: "Endereço", name: "contato_endereco", widget: "string" }

  # ============================================================
  # CONFIGURAÇÕES GERAIS
  # ============================================================
  - name: "config"
    label: "Configurações do site"
    description: "WhatsApp, PIX e redes sociais"
    files:
      - name: "config"
        label: "Contato, PIX e redes"
        file: "conteudo/config.yml"
        fields:
          - { label: "Nome oficial da associação", name: "nome", widget: "string" }
          - { label: "Nome curto", name: "nome_curto", widget: "string" }

          - label: "=== WHATSAPP ==="
            name: "divisor_wpp"
            widget: "hidden"
            default: ""
          - label: "Número do WhatsApp"
            name: "whatsapp_numero"
            widget: "string"
            hint: "Só números, com 55 + DDD. Exemplo: 5573998205303"
          - { label: "Número como aparece no site", name: "whatsapp_exibicao", widget: "string" }

          - label: "=== PIX ==="
            name: "divisor_pix"
            widget: "hidden"
            default: ""
          - { label: "Chave PIX (formatada)", name: "pix_chave", widget: "string" }
          - label: "Chave PIX (só números)"
            name: "pix_chave_numeros"
            widget: "string"
            hint: "Para o CNPJ, remova pontos, barra e traço"
          - { label: "Nome do recebedor (sem acentos)", name: "pix_nome_recebedor", widget: "string" }
          - { label: "Cidade do recebedor (sem acentos)", name: "pix_cidade", widget: "string" }
          - { label: "Descrição da doação", name: "pix_descricao", widget: "string" }

          - label: "=== REDES SOCIAIS ==="
            name: "divisor_redes"
            widget: "hidden"
            default: ""
          - { label: "Link do Instagram", name: "instagram", widget: "string" }
          - { label: "Usuário do Instagram", name: "instagram_usuario", widget: "string" }
          - { label: "Link do Facebook (opcional)", name: "facebook", widget: "string", required: false }
          - { label: "Endereço no rodapé", name: "rodape_endereco", widget: "string" }

  # ============================================================
  # PÁGINA DE DOAÇÕES
  # ============================================================
  - name: "doacoes"
    label: "Página de doações"
    description: "Textos da página de doações"
    files:
      - name: "doacoes"
        label: "Textos de doações"
        file: "conteudo/doacoes.yml"
        fields:
          - { label: "Selo do topo", name: "doacoes_selo", widget: "string" }
          - { label: "Título principal", name: "doacoes_titulo", widget: "string" }
          - { label: "Texto de apresentação", name: "doacoes_texto", widget: "text" }

          - label: "=== SEÇÃO PIX ==="
            name: "div_pix"
            widget: "hidden"
            default: ""
          - { label: "Título da seção PIX", name: "pix_titulo", widget: "string" }
          - { label: "Texto da seção PIX", name: "pix_texto", widget: "text" }
          - label: "Cartões de valores"
            name: "valores_doacao"
            widget: "list"
            fields:
              - { label: "Valor (ex.: R$ 30)", name: "valor", widget: "string" }
              - { label: "Descrição", name: "descricao", widget: "string" }
              - label: "Itens"
                name: "itens"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - { label: "Destacar este cartão?", name: "destaque", widget: "boolean", default: false }

          - label: "=== PARCERIAS ==="
            name: "div_parcerias"
            widget: "hidden"
            default: ""
          - { label: "Selo da seção", name: "parcerias_selo", widget: "string" }
          - { label: "Título da seção", name: "parcerias_titulo", widget: "string" }
          - { label: "Texto da seção", name: "parcerias_texto", widget: "text" }
          - label: "Formas de apoio"
            name: "formas_apoio"
            widget: "list"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Ícone (emoji)", name: "icone", widget: "string", required: false }
              - { label: "Texto", name: "texto", widget: "text" }

          - label: "=== TRANSPARÊNCIA ==="
            name: "div_transp"
            widget: "hidden"
            default: ""
          - { label: "Título", name: "transparencia_titulo", widget: "string" }
          - { label: "Texto", name: "transparencia_texto", widget: "text" }
          - label: "Itens de transparência"
            name: "transparencia_itens"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }

  # ============================================================
  # PÁGINA SEJA MULTIPLICADOR
  # ============================================================
  - name: "multiplicadores"
    label: "Página Seja Multiplicador"
    description: "Textos da página de cadastro de multiplicadores"
    files:
      - name: "multiplicadores"
        label: "Textos de multiplicadores"
        file: "conteudo/multiplicadores.yml"
        fields:
          - { label: "Selo do topo", name: "mult_selo", widget: "string" }
          - { label: "Título principal", name: "mult_titulo", widget: "string" }
          - { label: "Trecho destacado do título", name: "mult_titulo_destaque", widget: "string" }
          - { label: "Texto de apresentação", name: "mult_texto", widget: "text" }
          - { label: "Foto", name: "mult_foto", widget: "image", required: false }
          - { label: "Título do cartão flutuante", name: "mult_cartao_titulo", widget: "string" }
          - { label: "Texto do cartão flutuante", name: "mult_cartao_texto", widget: "string" }

          - label: "=== O QUE É SER MULTIPLICADOR ==="
            name: "div_quee"
            widget: "hidden"
            default: ""
          - { label: "Selo da seção", name: "que_e_selo", widget: "string" }
          - { label: "Título da seção", name: "que_e_titulo", widget: "string" }
          - { label: "Texto da seção", name: "que_e_texto", widget: "text" }
          - label: "Perfis de multiplicadores"
            name: "perfis"
            widget: "list"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Ícone (emoji)", name: "icone", widget: "string", required: false }
              - { label: "Texto", name: "texto", widget: "text" }

          - label: "=== PASSO A PASSO ==="
            name: "div_passos"
            widget: "hidden"
            default: ""
          - { label: "Selo da seção", name: "passos_selo", widget: "string" }
          - { label: "Título da seção", name: "passos_titulo", widget: "string" }
          - { label: "Texto da seção", name: "passos_texto", widget: "text" }
          - label: "Passos"
            name: "passos"
            widget: "list"
            fields:
              - { label: "Título do passo", name: "titulo", widget: "string" }
              - { label: "Texto do passo", name: "texto", widget: "text" }

          - { label: "Título 'O que oferecemos'", name: "oferecemos_titulo", widget: "string" }
          - label: "O que a associação oferece"
            name: "oferecemos"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - { label: "Título 'O que esperamos'", name: "esperamos_titulo", widget: "string" }
          - label: "O que esperamos de você"
            name: "esperamos"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }

          - label: "=== CIDADES ==="
            name: "div_cidades"
            widget: "hidden"
            default: ""
          - { label: "Selo da seção", name: "cidades_selo", widget: "string" }
          - { label: "Título da seção", name: "cidades_titulo", widget: "string" }
          - { label: "Texto da seção", name: "cidades_texto", widget: "text" }
          - label: "Lista de cidades"
            name: "cidades"
            widget: "list"
            field: { label: "Cidade", name: "item", widget: "string" }
          - { label: "Observação abaixo da lista", name: "cidades_obs", widget: "text" }

          - label: "=== CADASTRO ==="
            name: "div_cadastro"
            widget: "hidden"
            default: ""
          - { label: "Selo da seção", name: "cadastro_selo", widget: "string" }
          - { label: "Título da seção", name: "cadastro_titulo", widget: "string" }
          - { label: "Texto da seção", name: "cadastro_texto", widget: "text" }
